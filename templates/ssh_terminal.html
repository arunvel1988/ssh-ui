<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Vass Computers - SSH Terminal</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
  <style>
    body {
      background: linear-gradient(135deg, #0f172a, #1e3a8a);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      color: #e5e7eb;
      font-family: 'JetBrains Mono', monospace;
    }
    .glass {
      background: rgba(255, 255, 255, 0.08);
      border-radius: 16px;
      backdrop-filter: blur(12px);
      width: 90%;
      max-width: 900px;
      height: 80vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    #terminal {
      flex-grow: 1;
      background: rgba(0,0,0,0.8);
      color: #00ff9d;
      padding: 1rem;
      overflow-y: auto;
      white-space: pre-wrap;
      font-size: 0.95rem;
      border-bottom: 1px solid rgba(255,255,255,0.1);
    }
    #inputLine {
      background: rgba(15,23,42,0.9);
      border: none;
      padding: 0.8rem;
      font-size: 1rem;
      color: #00ff9d;
      outline: none;
      width: 100%;
    }
    #inputLine::placeholder { color: #4ade80; }
    .header {
      background: rgba(255,255,255,0.08);
      padding: 0.7rem 1rem;
      font-weight: 600;
      font-size: 0.9rem;
      color: #93c5fd;
      border-bottom: 1px solid rgba(255,255,255,0.1);
      display: flex;
      justify-content: space-between;
    }
  </style>
</head>
<body>
  <div class="glass">
    <div class="header">
      <span>💻 Vass Computers - SSH Terminal</span>
      <span class="text-gray-400 text-sm">{{ host }} — {{ username }}</span>
    </div>
    <div id="terminal"></div>
    <input id="inputLine" placeholder="Type command and press Enter..." autofocus>
  </div>

  <script>
    const socket = io();
    const terminal = document.getElementById('terminal');
    const input = document.getElementById('inputLine');

    socket.emit('connect_ssh', {
      host: "{{ host }}",
      username: "{{ username }}",
      password: "{{ password }}",
      key_file: "{{ key_file }}"
    });

    socket.on('ssh_output', (data) => {
      terminal.textContent += data.output;
      terminal.scrollTop = terminal.scrollHeight;
    });

    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        socket.emit('ssh_input', { input: input.value + '\n' });
        input.value = '';
        e.preventDefault();
      }
    });

    window.addEventListener('resize', () => {
      socket.emit('resize', {
        cols: 80,
        rows: Math.floor(window.innerHeight / 20)
      });
    });
  </script>
</body>
</html>
