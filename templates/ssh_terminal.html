<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>🌐 Interactive SSH Client</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/css/bootstrap.min.css">
<style>
body {
    background: linear-gradient(to right, #1f4037, #99f2c8);
    min-height: 100vh;
    font-family: 'Segoe UI', sans-serif;
}

h1 {
    color: white;
    text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
}

.form-container {
    background: rgba(255,255,255,0.1);
    padding: 30px;
    border-radius: 20px;
    box-shadow: 0 8px 20px rgba(0,0,0,0.3);
    backdrop-filter: blur(10px);
}

.btn-connect {
    background: linear-gradient(90deg, #11998e, #38ef7d);
    color: white;
    font-weight: bold;
    border: none;
    transition: all 0.3s;
}

.btn-connect:hover {
    transform: scale(1.05);
    box-shadow: 0 5px 15px rgba(0,0,0,0.3);
}
</style>
</head>
<body>
<div class="container mt-5">
    <h1 class="text-center mb-5">🔌 SSH Client Dashboard</h1>
    
    <div class="row justify-content-center">
        <div class="col-md-6 form-container">
            <form method="POST">
                <div class="mb-3">
                    <label class="form-label text-white">Hostname/IP</label>
                    <input type="text" class="form-control" name="host" placeholder="e.g., 10.0.0.1" required>
                </div>
                <div class="mb-3">
                    <label class="form-label text-white">Username</label>
                    <input type="text" class="form-control" name="username" placeholder="e.g., admin" required>
                </div>
                <div class="mb-3">
                    <label class="form-label text-white">Password (optional if key)</label>
                    <input type="password" class="form-control" name="password" placeholder="Enter password">
                </div>
                <div class="mb-3">
                    <label class="form-label text-white">Private Key Path (optional)</label>
                    <input type="text" class="form-control" name="key_file" placeholder="/home/user/id_rsa">
                </div>
                <button type="submit" class="btn btn-connect w-100">🚀 Connect</button>
            </form>
        </div>
    </div>
</div>
</body>
</html>
