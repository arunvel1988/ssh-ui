<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Vass Computers - RDP Session</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      background: linear-gradient(135deg, #0f172a, #1e3a8a);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Inter', sans-serif;
      color: white;
    }
    .glass {
      background: rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      box-shadow: 0 4px 30px rgba(0, 0, 0, 0.3);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.2);
    }
    iframe {
      border: none;
      border-radius: 16px;
      width: 100%;
      height: 70vh;
    }
    .glow-btn {
      transition: all 0.3s ease-in-out;
    }
    .glow-btn:hover {
      box-shadow: 0 0 15px 3px #60a5fa;
      transform: scale(1.05);
    }
  </style>
</head>

<body>
  <div class="glass p-10 w-full max-w-4xl text-center">
    <h1 class="text-3xl font-bold mb-2 text-blue-300">Vass Computers</h1>
    <p class="mb-6 text-gray-200">Windows Remote Desktop Session</p>

    <div class="mb-4 text-gray-300 text-sm">
      <p>Connected to <span class="text-blue-400 font-semibold">{{ host }}</span> as <span class="text-blue-400 font-semibold">{{ username }}</span></p>
    </div>

    <!-- Embed Guacamole or any RDP web client here -->
    <iframe src="http://34.47.254.251:8080/guacamole/#/client/{{ host }}"
            title="RDP Session"></iframe>

    <div class="mt-6">
      <a href="/" class="glow-btn p-2 rounded-md bg-blue-500 font-semibold hover:bg-blue-600">
        ⬅ Back to Dashboard
      </a>
    </div>

    <footer class="mt-6 text-sm text-gray-400">
      © 2025 Vass Computers. Secure Remote Access Suite.
    </footer>
  </div>
</body>
</html>
