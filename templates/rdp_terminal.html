<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Vass Computers - Full Screen RDP</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
      font-family: 'Inter', sans-serif;
    }

    iframe {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      border: none;
    }

    /* Button container - bottom right */
    .bottom-bar {
      position: fixed;
      bottom: 20px;
      right: 20px;
      z-index: 100;
      display: flex;
      gap: 10px;
    }

    /* Green glow buttons */
    .glow-btn {
      background-color: #22c55e; /* Tailwind green-500 */
      color: white;
      font-weight: 600;
      padding: 10px 16px;
      border-radius: 8px;
      transition: all 0.2s ease-in-out;
      cursor: pointer;
    }

    .glow-btn:hover {
      background-color: #16a34a; /* green-600 */
      box-shadow: 0 0 15px 3px #4ade80; /* soft green glow */
      transform: scale(1.05);
    }
  </style>
</head>

<body>
  <!-- Button bar (bottom right corner) -->
  <div class="bottom-bar">
    <a href="/" class="glow-btn">⬅ Back</a>
    <button id="fullscreen-btn" class="glow-btn" onclick="toggleFullScreen()">⛶ Full Screen</button>
  </div>

  <!-- Guacamole iframe -->
  <iframe 
    id="rdp-frame"
    src="http://34.47.254.251:8080/guacamole/#/client/{{ host }}" 
    title="RDP Session"
    allow="fullscreen; keyboard-lock; clipboard-read; clipboard-write"
    tabindex="0"
  ></iframe>

  <script>
    async function toggleFullScreen() {
      const iframe = document.getElementById('rdp-frame');
      const button = document.getElementById('fullscreen-btn');

      if (!document.fullscreenElement) {
        try {
          // Enter fullscreen
          await iframe.requestFullscreen();

          // Request keyboard lock (for Guacamole input)
          if (navigator.keyboard && navigator.keyboard.lock) {
            await navigator.keyboard.lock(['Escape']);
          }

          button.textContent = '⛶ Exit Full Screen';
        } catch (err) {
          console.error('Error entering fullscreen or locking keyboard:', err);
        }
      } else {
        // Exit fullscreen
        if (document.exitFullscreen) {
          await document.exitFullscreen();
        }
        button.textContent = '⛶ Full Screen';
      }
    }

    // Optional: update button when fullscreen is exited manually
    document.addEventListener('fullscreenchange', () => {
      const button = document.getElementById('fullscreen-btn');
      if (!document.fullscreenElement) {
        button.textContent = '⛶ Full Screen';
      }
    });
  </script>
</body>
</html>
