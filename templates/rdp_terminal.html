<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Vass Computers - RDP Session</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: linear-gradient(135deg, #0f172a, #1e3a8a);
      font-family: 'Inter', sans-serif;
      color: white;
    }

    .glass {
      background: rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      box-shadow: 0 4px 30px rgba(0, 0, 0, 0.3);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      height: 95vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 1rem;
      margin: auto;
      max-width: 90%;
    }

    iframe {
      flex-grow: 1;
      width: 100%;
      height: 100%;
      border: none;
      border-radius: 12px;
    }

    .glow-btn {
      transition: all 0.3s ease-in-out;
    }

    .glow-btn:hover {
      box-shadow: 0 0 15px 3px #60a5fa;
      transform: scale(1.05);
    }
  </style>
</head>

<body>
  <div class="glass">
    <div class="text-center">
      <h1 class="text-3xl font-bold mb-1 text-blue-300">Vass Computers</h1>
      <p class="mb-4 text-gray-200">Windows Remote Desktop Session</p>
    </div>

    <!-- Embed Guacamole here -->
    <iframe id="rdp-frame" src="http://34.47.254.251:8080/guacamole/#/client/{{ host }}" title="RDP Session"></iframe>

    <div class="mt-4 flex justify-center gap-3">
      <a href="/" class="glow-btn p-2 rounded-md bg-blue-500 font-semibold hover:bg-blue-600">
        ⬅ Back to Dashboard
      </a>

      <button onclick="toggleFullScreen()" class="glow-btn p-2 rounded-md bg-green-500 font-semibold hover:bg-green-600">
        ⛶ Full Screen
      </button>
    </div>

    <footer class="mt-4 text-center text-sm text-gray-400">
      © 2025 Vass Computers. Secure Remote Access Suite.
    </footer>
  </div>

  <script>
    function toggleFullScreen() {
      const iframe = document.getElementById('rdp-frame');
      if (!document.fullscreenElement) {
        iframe.requestFullscreen().catch(err => {
          alert(`Error trying fullscreen: ${err.message}`);
        });
      } else {
        document.exitFullscreen();
      }
    }
  </script>
</body>
</html>
