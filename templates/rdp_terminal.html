<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Vass Computers - Full Screen RDP</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
      font-family: 'Inter', sans-serif;
    }

    iframe {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      border: none;
    }

    .top-bar {
      position: fixed;
      top: 10px;
      left: 10px;
      z-index: 100;
      display: flex;
      gap: 10px;
    }

    .glow-btn {
      background-color: #2563eb;
      color: white;
      font-weight: 600;
      padding: 8px 14px;
      border-radius: 6px;
      transition: all 0.2s ease-in-out;
    }

    .glow-btn:hover {
      background-color: #1d4ed8;
      box-shadow: 0 0 15px 3px #60a5fa;
      transform: scale(1.05);
    }

    .exit-btn {
      background-color: #ef4444;
    }

    .exit-btn:hover {
      background-color: #dc2626;
    }
  </style>
</head>

<body>
  <!-- Control bar -->
  <div class="top-bar">
    <a href="/" class="glow-btn">⬅ Back</a>
    <button class="glow-btn" onclick="enterFullScreen()">⛶ Full Screen</button>
  </div>

  <!-- Guacamole iframe -->
  <iframe id="rdp-frame" src="http://34.47.254.251:8080/guacamole/#/client/{{ host }}" title="RDP Session"></iframe>

  <script>
    function enterFullScreen() {
      const iframe = document.getElementById('rdp-frame');
      if (iframe.requestFullscreen) {
        iframe.requestFullscreen();
      } else if (iframe.webkitRequestFullscreen) { /* Safari */
        iframe.webkitRequestFullscreen();
      } else if (iframe.msRequestFullscreen) { /* IE11 */
        iframe.msRequestFullscreen();
      }
    }
  </script>
</body>
</html>
