<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Vass Computers - Full Screen RDP</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
      font-family: 'Inter', sans-serif;
    }

    iframe {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      border: none;
    }

    /* Button container - bottom right */
    .bottom-bar {
      position: fixed;
      bottom: 20px;
      right: 20px;
      z-index: 100;
      display: flex;
      gap: 10px;
    }

    /* Green glow buttons */
    .glow-btn {
      background-color: #22c55e; /* Tailwind green-500 */
      color: white;
      font-weight: 600;
      padding: 10px 16px;
      border-radius: 8px;
      transition: all 0.2s ease-in-out;
      cursor: pointer;
    }

    .glow-btn:hover {
      background-color: #16a34a; /* green-600 */
      box-shadow: 0 0 15px 3px #4ade80; /* soft green glow */
      transform: scale(1.05);
    }
  </style>
</head>

<body>
  <!-- Button bar (bottom right corner) -->
  <div class="bottom-bar">
    <a href="/" class="glow-btn">⬅ Back</a>
  </div>

  <!-- Guacamole iframe (embed mode for proper focus) -->
  <iframe 
    id="rdp-frame"
    src="http://34.47.254.251:8080/guacamole/#/client/{{ host }}?embed=true"
    title="RDP Session"
    allow="fullscreen; keyboard-lock; clipboard-read; clipboard-write"
    tabindex="0"
  ></iframe>
</body>
</html>
