version: '3.9'

services:
  mysql:
    image: mysql:8
    container_name: guac-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: guacroot
      MYSQL_DATABASE: guacdb
      MYSQL_USER: guacuser
      MYSQL_PASSWORD: guacpass
    volumes:
      - guac-mysql-data:/var/lib/mysql
      - ./init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-pguacroot"]
      interval: 5s
      timeout: 3s
      retries: 10

  initdb:
    image: guacamole/guacamole
    container_name: guac-initdb
    depends_on:
      mysql:
        condition: service_healthy
    entrypoint: /bin/sh
    command:
      - -c
      - |
        echo "🔧 Generating Guacamole schema..."
        /opt/guacamole/bin/initdb.sh --mysql > /init/initdb.sql
    volumes:
      - ./init:/init
    restart: "no"

  guacd:
    image: guacamole/guacd
    container_name: guacd
    restart: unless-stopped

  guacamole:
    image: guacamole/guacamole
    container_name: guacamole
    depends_on:
      mysql:
        condition: service_healthy
      initdb:
        condition: service_completed_successfully
      guacd:
        condition: service_started
    environment:
      MYSQL_HOSTNAME: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: guacdb
      MYSQL_USER: guacuser
      MYSQL_PASSWORD: guacpass
      GUACD_HOSTNAME: guacd
      GUACD_PORT: 4822
    ports:
      - "8080:8080"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/guacamole/"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  guac-mysql-data:
